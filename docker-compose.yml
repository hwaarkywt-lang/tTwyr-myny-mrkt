version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: market-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=market_db
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  postgres:
    image: postgres:15
    container_name: market-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=workspace_user
      - POSTGRES_PASSWORD=workspace_pass
      - POSTGRES_DB=workspace_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  backend:
    build:
      context: ./market-backend
    container_name: market-backend
    restart: unless-stopped
    env_file:
      - ./market-backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    volumes:
      - ./market-backend:/app
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "5000"]

volumes:
  mongo_data:
  postgres_data:

# Usage:
# 1. Copy market-backend/.env.example -> market-backend/.env and adjust values if needed.
# 2. Run: docker compose up -d --build
# 3. The compose file now includes the backend service; the backend will be available at http://localhost:5000
# 4. If you prefer to run the backend outside Docker for development, follow steps in replit.md
