name: CI Build and Publish (Docker image)

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/market-backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (check syntax)
        run: |
          python -m pip install --upgrade pip
          pip install -r market-backend/requirements.txt
          # quick smoke check: compile Python files to catch syntax errors
          python -m compileall market-backend || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v4
        with:
          context: ./market-backend
          file: ./market-backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/market-backend:latest
            ghcr.io/${{ github.repository_owner }}/market-backend:${{ github.sha }}

      - name: Optional: run MongoDB connection smoke test
        if: ${{ secrets.MONGO_URL != '' }}
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
        run: |
          python market-backend/test_mongo.py

      - name: Done
        run: echo "CI finished. Docker image pushed to ghcr.io/${{ github.repository_owner }}/market-backend"
